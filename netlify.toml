[build]
  base = ""
  publish = "frontend/dist"
  command = "npm install --prefix frontend && npm --prefix frontend run build"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"

# Handle SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
